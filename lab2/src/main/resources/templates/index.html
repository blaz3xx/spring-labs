<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Форум - Головна</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-primary mb-4">Форум (Варіант 4)</h1>

        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-secondary text-white">
                <h5 class="mb-0">Створення нової теми (Адміністратор)</h5>
            </div>
            <div class="card-body">
                <form action="/topic/create" method="post" class="row g-3">
                    <div class="col-md-5">
                        <input type="text" name="title" class="form-control" placeholder="Назва теми" required>
                    </div>
                    <div class="col-md-5">
                        <input type="text" name="author" class="form-control" placeholder="Ваше ім'я" required>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-success w-100">Створити</button>
                    </div>
                </form>
            </div>
        </div>

        <h2 class="mb-3">Список тем</h2>
        <div class="list-group shadow-sm">
            <div th:each="topic : ${topics}" class="list-group-item">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div>
                        <a th:href="@{/topic/{id}(id=${topic.id})}" th:text="${topic.title}" class="text-decoration-none fw-bold fs-5"></a>
                        <span class="text-muted ms-2" th:text="'(Автор: ' + ${topic.author} + ')'"></span>
                    </div>
                    
                    <form th:action="@{/topic/{id}/delete(id=${topic.id})}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger btn-sm">Видалити</button>
                    </form>
                </div>
                
                <form th:action="@{/topic/{id}/edit(id=${topic.id})}" method="post" class="row g-2 align-items-center mt-2 border-top pt-2">
                    <div class="col-auto">
                        <span class="text-muted small">Редагувати:</span>
                    </div>
                    <div class="col-md-4">
                        <input type="text" name="title" class="form-control form-control-sm" th:value="${topic.title}" required>
                    </div>
                    <div class="col-md-3">
                        <input type="text" name="author" class="form-control form-control-sm" th:value="${topic.author}" required>
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-outline-secondary btn-sm">Зберегти</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
