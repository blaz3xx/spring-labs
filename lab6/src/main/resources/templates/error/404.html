<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Сторінку не знайдено — Форум</title>
    <link rel="stylesheet" th:href="@{/css/forum.css}">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<div th:replace="~{fragments :: header(false)}"></div>

<main class="wrap status-page">
    <p class="status-code">404</p>
    <h1 class="display">Такої сторінки немає<span class="dot">.</span></h1>
    <p class="lead">Можливо, тему вже видалили або в посиланні є помилка.</p>
    <a th:href="@{/}" class="pill dark">До списку тем</a>
</main>

<div th:replace="~{fragments :: footer}"></div>

<script th:src="@{/js/forum.js}"></script>
</body>
</html>
